<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 524" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pareto-query-title pareto-query-desc">
  <title id="pareto-query-title">Fuzzy search libraries: MRR vs query latency, index prebuilt</title>
  <desc id="pareto-query-desc">Scatter plot of 11 configurations of eight JavaScript fuzzy search libraries comparing MRR (how highly each ranks the queried item) against query milliseconds with indexes prebuilt, on a log scale, on the mixed 10k corpus over 15 probes. The Pareto frontier runs fuzzysort (0.54 MRR at 0.14 ms) to Krino (0.80 MRR at 0.16 ms) to Krino (acronym) (0.84 MRR at 0.17 ms). Krino owns the accurate end of the frontier; the cheaper points on it are markedly less accurate, and every other configuration, including Fuse.js, is dominated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="524" fill="#1a1a19"/>
  <text x="66" y="28" fill="#ffffff" font-size="18" font-weight="600">Ranking quality vs. warm query cost</text>
  <text x="66" y="47" fill="#c3c2b7" font-size="13">MRR over 15 probes · mixed 10k corpus · index built once at load</text>
