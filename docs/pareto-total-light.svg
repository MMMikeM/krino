<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 524" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="pareto-total-title pareto-total-desc">
  <title id="pareto-total-title">Fuzzy search libraries: MRR vs total cost (index + one query)</title>
  <desc id="pareto-total-desc">Scatter plot of 14 configurations of eight JavaScript fuzzy search libraries comparing MRR (how highly each ranks the queried item) against total milliseconds for one cold search (index build plus one query), on a log scale, on the mixed 10k corpus over 15 probes. The Pareto frontier runs uFuzzy (0.14 MRR at 0.19 ms) to uFuzzy (all opts) (0.49 MRR at 0.90 ms) to Krino (0.80 MRR at 1.50 ms) to Krino (acronym) (0.84 MRR at 1.50 ms). The no-index engines own the cheapest cold one-shots; the two Krino configurations share one pooled build cost and differ only in query time, fuzzysort's hidden prepare cache moves it off this frontier, and Fuse.js is dominated.</desc>
